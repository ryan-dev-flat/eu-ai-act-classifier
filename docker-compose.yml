name: eu-ai-act-classifier

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classifier
      POSTGRES_PASSWORD: classifier
      POSTGRES_DB: classifier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classifier"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.68.0-rootless
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./rules:/policies:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: eu-ai-act/api-gateway:dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT_GATEWAY: "4000"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.local.eu-ai-act.dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-eu-ai-act-classifier}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-http://host.docker.internal:4444/.well-known/jwks.json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      CLASSIFICATION_URL: http://host.docker.internal:4001
      WORKFLOW_URL: http://host.docker.internal:4002
      REGULATORY_URL: http://host.docker.internal:4003
      TIMELINE_URL: http://host.docker.internal:4004
      AUDIT_LOG_URL: http://host.docker.internal:4005
      NOTIFICATION_URL: http://host.docker.internal:4006
      TENANT_URL: http://host.docker.internal:4007
      EXPORT_URL: http://host.docker.internal:4008
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:4000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - gateway

volumes:
  postgres-data:
  minio-data:
