name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classifier
          POSTGRES_PASSWORD: classifier
          POSTGRES_DB: classifier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U classifier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: eu-ai-act-classifier/pnpm-lock.yaml

      - name: Install
        working-directory: eu-ai-act-classifier
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        working-directory: eu-ai-act-classifier
        run: pnpm typecheck

      - name: Lint
        working-directory: eu-ai-act-classifier
        run: pnpm lint

      - name: Build
        working-directory: eu-ai-act-classifier
        run: pnpm build

      - name: Test
        working-directory: eu-ai-act-classifier
        env:
          DATABASE_URL: postgres://classifier:classifier@localhost:5432/classifier
          AUDIT_DATABASE_URL: postgres://classifier:classifier@localhost:5432/classifier
          REDIS_URL: redis://localhost:6379
        run: pnpm test
